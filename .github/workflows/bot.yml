name: Hyperliquid Bot GridRB
# Ручной запуск GridRB 80/20. Автозапуск по расписанию отключён 2026-10-20.
# Чтобы вернуть расписание — раскомментировать строку schedule ниже.
on:
  # schedule: [{cron: '7,19,33,46,58 * * * *'}]  # UTC
  workflow_dispatch:
    inputs:
      poll_interval:
        description: 'Пауза между итерациями, сек (по умолч. 60)'
        required: false
        default: '60'
      watch_seconds:
        description: 'Длительность работы, сек (по умолч. 19800 = 5.5 ч)'
        required: false
        default: '19800'
# concurrency: не допускаем два одновременных запуска на один счёт.
# cancel-in-progress: false — новый запуск ждёт, а не убивает текущий.
concurrency:
  group: gridrb-${{ github.repository }}
  cancel-in-progress: false
jobs:
  gridrb:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # потолок 360; бюджет: вотч 330 + хвост 15 + установка 1 = 346
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.txt'}
      - run: pip install -r requirements.txt
      - name: Run GridRB
        env:
          BOT_RUNTIME: github_actions
          BOT_POLL_INTERVAL: ${{ github.event.inputs.poll_interval }}
          WATCH_SECONDS: ${{ github.event.inputs.watch_seconds }}
          PYTHONUNBUFFERED: '1'
          DB_ENCRYPTION_PASSWORD: ${{ secrets.DB_ENCRYPTION_PASSWORD }}
          WALLETS_DATA: ${{ secrets.WALLETS_DATA }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          PROFIT_BOT_TOKEN: ${{ secrets.PROFIT_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          echo "::add-mask::${{ secrets.WALLETS_DATA }}"
          echo "::add-mask::${{ secrets.DB_ENCRYPTION_PASSWORD }}"
          echo "::add-mask::${{ secrets.TG_BOT_TOKEN }}"
          echo "::add-mask::${{ secrets.PROFIT_BOT_TOKEN }}"
          BOT_POLL_INTERVAL="${BOT_POLL_INTERVAL:-60}"
          case "$BOT_POLL_INTERVAL" in ''|*[!0-9]*) BOT_POLL_INTERVAL=60 ;; esac
          WATCH_SECONDS="${WATCH_SECONDS:-19800}"
          case "$WATCH_SECONDS" in ''|*[!0-9]*) WATCH_SECONDS=19800 ;; esac
          python main.py --watch-seconds "$WATCH_SECONDS" --poll-interval "$BOT_POLL_INTERVAL" < /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bot-logs, path: hyperliquid_bot.log}